spring:
  application:
    name: vantix
  datasource:
    url: ${VANTIX_DB_URL:jdbc:mysql://localhost:3306/vantix?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${VANTIX_DB_USERNAME:root}
    password: ${VANTIX_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

vantix:
  service-code-generation:
    max-quantity-per-request: 5000
    max-items-per-order: 50
    max-total-quantity-per-order: 5000
  offline-import:
    max-file-size-bytes: 10485760
    max-rows: 500
    max-total-codes: 5000
    max-errors: 100
  service-code:
    upcoming-days: ${VANTIX_SERVICE_CODE_UPCOMING_DAYS:30}

server:
  port: ${VANTIX_SERVER_PORT:8080}

spring:
  application:
    name: vantix
  datasource:
    url: ${VANTIX_DB_URL:jdbc:mysql://localhost:3306/vantix?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${VANTIX_DB_USERNAME:root}
    password: ${VANTIX_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

vantix:
  company-sync:
    enabled: ${VANTIX_COMPANY_SYNC_ENABLED:true}
    cron: ${VANTIX_COMPANY_SYNC_CRON:0 0 */6 * * ?}
    zone: ${VANTIX_COMPANY_SYNC_ZONE:Asia/Shanghai}
    page-size: ${VANTIX_COMPANY_SYNC_PAGE_SIZE:200}
  cors-db:
    enabled: ${VANTIX_CORS_DB_ENABLED:false}
    jdbc-url: ${VANTIX_CORS_DB_URL:}
    username: ${VANTIX_CORS_DB_USERNAME:}
    password: ${VANTIX_CORS_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    maximum-pool-size: 5
    minimum-idle: 0
    status-sync:
      enabled: ${VANTIX_CORS_DB_STATUS_SYNC_ENABLED:false}
      cron: ${VANTIX_CORS_DB_STATUS_SYNC_CRON:0 0 2 * * ?}
      zone: ${VANTIX_CORS_DB_STATUS_SYNC_ZONE:Asia/Shanghai}
      batch-size: ${VANTIX_CORS_DB_STATUS_SYNC_BATCH_SIZE:500}
  cors-redis:
    enabled: ${VANTIX_CORS_REDIS_ENABLED:false}
    host: ${VANTIX_CORS_REDIS_HOST:}
    port: ${VANTIX_CORS_REDIS_PORT:6379}
    username: ${VANTIX_CORS_REDIS_USERNAME:}
    password: ${VANTIX_CORS_REDIS_PASSWORD:}
    database: ${VANTIX_CORS_REDIS_DATABASE:0}
    ssl: ${VANTIX_CORS_REDIS_SSL:false}
    channel: ${VANTIX_CORS_REDIS_CHANNEL:LW_WEBCORS_PLATUPDATE}
    connect-timeout: ${VANTIX_CORS_REDIS_CONNECT_TIMEOUT:2s}
    recovery-interval: ${VANTIX_CORS_REDIS_RECOVERY_INTERVAL:5s}
    worker-core-size: ${VANTIX_CORS_REDIS_WORKER_CORE_SIZE:2}
    worker-max-size: ${VANTIX_CORS_REDIS_WORKER_MAX_SIZE:4}
    queue-capacity: ${VANTIX_CORS_REDIS_QUEUE_CAPACITY:1000}
    confirmation-delay: ${VANTIX_CORS_REDIS_CONFIRMATION_DELAY:500ms}
  service-code-generation:
    max-quantity-per-request: 5000
    max-items-per-order: 50
    max-total-quantity-per-order: 5000
    batch-insert-size: 500
  offline-import:
    max-file-size-bytes: 10485760
    max-rows: 500
    max-total-codes: 5000
    max-errors: 100
  service-code:
    upcoming-days: ${VANTIX_SERVICE_CODE_UPCOMING_DAYS:30}
  cors:
    base-url: ${VANTIX_CORS_BASE_URL:http://localhost:8081}
    connect-timeout: ${VANTIX_CORS_CONNECT_TIMEOUT:2s}
    read-timeout: ${VANTIX_CORS_READ_TIMEOUT:5s}
    account-status-sync:
      enabled: ${VANTIX_CORS_ACCOUNT_STATUS_SYNC_ENABLED:false}
      fixed-delay: ${VANTIX_CORS_ACCOUNT_STATUS_SYNC_FIXED_DELAY:1m}
      stale-after: ${VANTIX_CORS_ACCOUNT_STATUS_SYNC_STALE_AFTER:10m}
      batch-size: ${VANTIX_CORS_ACCOUNT_STATUS_SYNC_BATCH_SIZE:100}
      retry-base-delay: ${VANTIX_CORS_ACCOUNT_STATUS_SYNC_RETRY_BASE_DELAY:1m}
      retry-max-delay: ${VANTIX_CORS_ACCOUNT_STATUS_SYNC_RETRY_MAX_DELAY:30m}
    renewal:
      enabled: ${VANTIX_CORS_RENEWAL_ENABLED:false}
      poll-interval: ${VANTIX_CORS_RENEWAL_POLL_INTERVAL:5s}
      worker-batch-size: ${VANTIX_CORS_RENEWAL_WORKER_BATCH_SIZE:20}
      max-retries: ${VANTIX_CORS_RENEWAL_MAX_RETRIES:10}
      retry-base-delay: ${VANTIX_CORS_RENEWAL_RETRY_BASE_DELAY:30s}
      retry-max-delay: ${VANTIX_CORS_RENEWAL_RETRY_MAX_DELAY:1h}
      claim-timeout: ${VANTIX_CORS_RENEWAL_CLAIM_TIMEOUT:2m}
    password:
      enabled: ${VANTIX_CORS_PASSWORD_ENABLED:false}
      poll-interval: ${VANTIX_CORS_PASSWORD_POLL_INTERVAL:5s}
      worker-batch-size: ${VANTIX_CORS_PASSWORD_WORKER_BATCH_SIZE:20}
      max-retries: ${VANTIX_CORS_PASSWORD_MAX_RETRIES:10}
      retry-base-delay: ${VANTIX_CORS_PASSWORD_RETRY_BASE_DELAY:30s}
      retry-max-delay: ${VANTIX_CORS_PASSWORD_RETRY_MAX_DELAY:1h}
      claim-timeout: ${VANTIX_CORS_PASSWORD_CLAIM_TIMEOUT:2m}
  cors-operation:
    enabled: ${VANTIX_CORS_OPERATION_ENABLED:true}
    poll-interval: ${VANTIX_CORS_OPERATION_POLL_INTERVAL:5s}
    max-retries: ${VANTIX_CORS_OPERATION_MAX_RETRIES:10}
    retry-base-delay: ${VANTIX_CORS_OPERATION_RETRY_BASE_DELAY:30s}
    claim-timeout: ${VANTIX_CORS_OPERATION_CLAIM_TIMEOUT:2m}
    worker-batch-size: ${VANTIX_CORS_OPERATION_WORKER_BATCH_SIZE:20}

server:
  port: ${VANTIX_SERVER_PORT:8080}

spring:
  application:
    name: vantix
  datasource:
    url: ${VANTIX_DB_URL:jdbc:mysql://localhost:3306/vantix?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${VANTIX_DB_USERNAME:root}
    password: ${VANTIX_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

vantix:
  service-code-generation:
    max-quantity-per-request: 5000
    max-items-per-order: 50
    max-total-quantity-per-order: 5000
    batch-insert-size: 500
  offline-import:
    max-file-size-bytes: 10485760
    max-rows: 500
    max-total-codes: 5000
    max-errors: 100
  service-code:
    upcoming-days: ${VANTIX_SERVICE_CODE_UPCOMING_DAYS:30}
  cors:
    base-url: ${VANTIX_CORS_BASE_URL:http://localhost:8081}
    connect-timeout: ${VANTIX_CORS_CONNECT_TIMEOUT:2s}
    read-timeout: ${VANTIX_CORS_READ_TIMEOUT:5s}
    account-status-sync:
      enabled: ${VANTIX_CORS_ACCOUNT_STATUS_SYNC_ENABLED:false}
      fixed-delay: ${VANTIX_CORS_ACCOUNT_STATUS_SYNC_FIXED_DELAY:1m}
      stale-after: ${VANTIX_CORS_ACCOUNT_STATUS_SYNC_STALE_AFTER:10m}
      batch-size: ${VANTIX_CORS_ACCOUNT_STATUS_SYNC_BATCH_SIZE:100}
      retry-base-delay: ${VANTIX_CORS_ACCOUNT_STATUS_SYNC_RETRY_BASE_DELAY:1m}
      retry-max-delay: ${VANTIX_CORS_ACCOUNT_STATUS_SYNC_RETRY_MAX_DELAY:30m}
  cors-operation:
    enabled: ${VANTIX_CORS_OPERATION_ENABLED:true}
    poll-interval: ${VANTIX_CORS_OPERATION_POLL_INTERVAL:5s}
    max-retries: ${VANTIX_CORS_OPERATION_MAX_RETRIES:10}
    retry-base-delay: ${VANTIX_CORS_OPERATION_RETRY_BASE_DELAY:30s}
    claim-timeout: ${VANTIX_CORS_OPERATION_CLAIM_TIMEOUT:2m}
    worker-batch-size: ${VANTIX_CORS_OPERATION_WORKER_BATCH_SIZE:20}

server:
  port: ${VANTIX_SERVER_PORT:8080}
